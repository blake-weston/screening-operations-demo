# SR12: limit Apache disclosure and unused protocol behavior behind nginx.
ServerName localhost
ServerSignature Off
ServerTokens Prod
TraceEnable Off

# SR12: the application has no .htaccess files and directory listings are not required.
<Directory /var/www/html>
    Options -Indexes
    AllowOverride None
    Require all granted
</Directory>

# SR12: never serve hidden files or common editor/backup artifacts from the document root.
<FilesMatch "(^\.|~$|\.(bak|old|orig|save|swp)$)">
    Require all denied
</FilesMatch>
