name: airport-security

services:
  nginx:
    # SR08: use the current stable Nginx line rather than the vulnerable baseline image.
    image: nginx:1.30.6-alpine3.24
    depends_on:
      - web
    ports:
      - "8443:443"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/certs:/etc/nginx/certs:ro
      - ./nginx/errors:/usr/share/nginx/errors:ro
    networks:
      - frontend

  web:
    build:
      context: .
      dockerfile: Dockerfile
    volumes:
      - ./data:/var/www/html
      - ./threat_media/import:/srv/threat_media/import:ro
      - ./threat_media/originals:/srv/threat_media/originals
      - ./threat_media/thumbnails:/srv/threat_media/thumbnails
    depends_on:
      - db
    environment:
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: airport_security
      # SR10: fail closed unless credentials are supplied from an ignored local environment.
      DB_USERNAME: ${DB_USERNAME:?Set DB_USERNAME in an untracked .env file}
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in an untracked .env file}
    networks:
      - frontend
      - database

  db:
    # SR08: MySQL remains on its supported 8.4 LTS stream and is refreshed on rebuild.
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: airport_security
      MYSQL_USER: ${DB_USERNAME:?Set DB_USERNAME in an untracked .env file}
      MYSQL_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in an untracked .env file}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?Set DB_ROOT_PASSWORD in an untracked .env file}
    # SR09: no host port is published; only the web service joins this internal network.
    networks:
      - database
    volumes:
      - mysql_data:/var/lib/mysql
      - ./db/init:/docker-entrypoint-initdb.d:ro

volumes:
  mysql_data:

networks:
  frontend:
  database:
    internal: true
