name: airport-security

services:
  nginx:
    image: nginx:1.27-alpine
    depends_on:
      - web
    ports:
      - "8443:443"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/certs:/etc/nginx/certs:ro

  web:
    build:
      context: .
      dockerfile: Dockerfile
    volumes:
      - ./data:/var/www/html
      - ./threat_media/import:/srv/threat_media/import:ro
      - ./threat_media/originals:/srv/threat_media/originals
      - ./threat_media/thumbnails:/srv/threat_media/thumbnails
    depends_on:
      - db
    environment:
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: airport_security
      DB_USERNAME: app
      DB_PASSWORD: app_password

  db:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: airport_security
      MYSQL_USER: app
      MYSQL_PASSWORD: app_password
      MYSQL_ROOT_PASSWORD: root_password
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./db/init:/docker-entrypoint-initdb.d:ro

volumes:
  mysql_data:
